# Fuel price check for the cost calculator (kalkulator-troskova).
# The Ministry of Trade sets new maximum prices every Friday at 15:00 (Belgrade).
# Runs (Belgrade time):  every day at 7:00, and on Friday at 15:10 with a retry at 16:10.
# GitHub schedules in UTC, so each time is listed for winter (UTC+1) and summer (UTC+2) time;
# the extra run does no harm. Each run writes today's date as "provereno" (shown on the site as
# "cene na dan ...") and changes the prices only when they changed.
# If the source can't be read or the numbers look wrong, the run fails, nothing on the site changes,
# and GitHub emails you ("Run failed: Cene goriva"). Every run is listed under Actions > Cene goriva.
name: Cene goriva

on:
  schedule:
    - cron: '0 5 * * *'      # 7:00 summer time (CEST) / 6:00 winter time
    - cron: '0 6 * * *'      # 7:00 winter time (CET)  / 8:00 summer time
    - cron: '10 13 * * 5'    # Friday 15:10 summer time
    - cron: '10 14 * * 5'    # Friday 15:10 winter time / 16:10 summer time
    - cron: '10 15 * * 5'    # Friday 16:10 winter time (retry)
  workflow_dispatch: {}      # "Run workflow" button for a manual check

permissions:
  contents: write

concurrency:
  group: cene-goriva
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read fuel prices
        run: python3 build/update_fuel.py

      - name: Rebuild site if the prices or the check date changed
        id: changed
        run: |
          if git diff --quiet -- data/gorivo.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            python3 build/build_site.py
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push (Cloudflare publishes automatically)
        if: steps.changed.outputs.changed == 'true'
        run: |
          git config user.name "evomobil cene goriva"
          git config user.email "office@evomobil.rs"
          git add data/gorivo.json site
          git commit -m "Cene goriva: BMB 95 $(python3 -c "import json;print(json.load(open('data/gorivo.json'))['benzin'])") RSD, Evrodizel $(python3 -c "import json;print(json.load(open('data/gorivo.json'))['dizel'])") RSD"
          git pull --rebase --autostash
          git push
